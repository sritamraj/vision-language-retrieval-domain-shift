# Ablation: full Method B but with random (non-hard) negative sampling.
# Isolates how much of the gain is about *which* negatives the model sees
# under domain shift vs. the adapter/MMD machinery itself.
experiment_name: "ablation_no_hard_negatives"
seed: 42
stage: "adaptation"
adaptation_method: "adapter_mmd"
model: "configs/model.yaml"
data: "configs/data.yaml"
load_checkpoint: "experiments/baseline/checkpoints/best.pt"
adapter_override:
  enabled: true
  bottleneck_dim: 64
  residual_ratio: 0.2
  apply_to: ["image", "text"]
train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 0.01
  loss: "clip_contrastive"
  temperature: 0.07
  hard_negative_mining: false
  mmd:
    enabled: true
    weight: 1.0
    kernel: "rbf"
    source_bank_path: "results/logs/source_embedding_bank.npz"
    source_bank_size: 2000
eval:
  domain: "target"
  metrics: ["recall@1", "recall@5", "recall@10", "mAP"]
  out_file: "results/tables/ablation_no_hard_negatives_eval.json"
checkpoint:
  save_dir: "experiments/ablations/checkpoints/no_hard_negatives"
