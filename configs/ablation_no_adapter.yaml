# Ablation: MMD alignment applied directly to the frozen backbone's output
# projection (no adapter capacity at all). Isolates whether adapters are
# doing real work or MMD alone would suffice.
experiment_name: "ablation_no_adapter"
seed: 42
stage: "adaptation"
adaptation_method: "adapter_mmd"
model: "configs/model.yaml"
data: "configs/data.yaml"
load_checkpoint: "experiments/baseline/checkpoints/best.pt"
adapter_override:
  enabled: false
train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 0.01
  loss: "clip_contrastive"
  temperature: 0.07
  hard_negative_mining: true
  hard_negative_top_k: 5
  mmd:
    enabled: true
    weight: 1.0
    kernel: "rbf"
    source_bank_path: "results/logs/source_embedding_bank.npz"
    source_bank_size: 2000
eval:
  domain: "target"
  metrics: ["recall@1", "recall@5", "recall@10", "mAP"]
  out_file: "results/tables/ablation_no_adapter_eval.json"
checkpoint:
  save_dir: "experiments/ablations/checkpoints/no_adapter"
