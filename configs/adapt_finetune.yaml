# Method A: straightforward full fine-tune on the (small) target training split.
experiment_name: "method_a_full_finetune"
seed: 42
stage: "adaptation"
adaptation_method: "full_finetune"
model: "configs/model.yaml"
data: "configs/data.yaml"

load_checkpoint: "experiments/baseline/checkpoints/best.pt"

train:
  epochs: 15
  lr: 1.0e-6                    # small LR — target set is tiny, easy to overfit
  weight_decay: 0.1
  loss: "clip_contrastive"
  temperature: 0.07

eval:
  domain: "target"
  metrics: ["recall@1", "recall@5", "recall@10", "mAP"]
  out_file: "results/tables/method_a_eval.json"

checkpoint:
  save_dir: "experiments/adaptation/checkpoints/method_a"
